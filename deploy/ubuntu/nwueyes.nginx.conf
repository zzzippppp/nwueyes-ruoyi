server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/nwueyes;
    index index.html;
    client_max_body_size 200m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # VITE_APP_BASE_API=/prod-api. The trailing slash removes this prefix
    # before forwarding to Spring Boot, whose context path is /.
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Browser-facing go2rtc signaling and stream page. Its API remains bound
    # to 127.0.0.1; open UDP/8555 only to the trusted LAN for WebRTC media.
    location /go2rtc/ {
        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
