# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${NWUEYES_UPLOAD_PATH:./data/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # local 使 application-local.yml 作为 profile 加载，可覆盖 druid 中的库密码等本地项
    active: druid,local
  config:
    import: optional:classpath:application-local.yml
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（场景片/回放上传可能超过 30MB）
      max-file-size: 200MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（可用环境变量 TOKEN_SECRET 覆盖）
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 萤石开放平台配置
ezviz:
  baseUrl: https://open.ys7.com
  appKey: ${EZVIZ_APP_KEY:}
  appSecret: ${EZVIZ_APP_SECRET:}
  defaultChannelNo: ${EZVIZ_DEFAULT_CHANNEL_NO:1}

# 识别事件接入配置
presence:
  # go2rtc 随后端自启动（后端就绪后拉起本机 go2rtc；端口已被占用则跳过）
  go2rtc:
    autoStart: ${GO2RTC_AUTO_START:true}
    # 运行中 API 不可达时自动拉起，并重新注册已缓存的摄像头流
    autoRestart: ${GO2RTC_AUTO_RESTART:true}
    watchdogIntervalSec: ${GO2RTC_WATCHDOG_INTERVAL_SEC:15}
    failThreshold: ${GO2RTC_FAIL_THRESHOLD:2}
    exePath: ${GO2RTC_EXE_PATH:tools/go2rtc/go2rtc.exe}
    configPath: ${GO2RTC_CONFIG_PATH:tools/go2rtc/go2rtc.yaml}
  ingest:
    enabled: ${PRESENCE_INGEST_ENABLED:false}
    apiKey: ${PRESENCE_INGEST_API_KEY:}
    defaultCameraId: ${PRESENCE_INGEST_DEFAULT_LOCATION_ID:1}
    workspaceRoot: ${PRESENCE_REPLAY_WORKSPACE_ROOT:./ruoyi}
    replayPythonCommand: ${PRESENCE_REPLAY_PYTHON:python}
    replayScriptPath: ${PRESENCE_REPLAY_SCRIPT:scripts/video_replay_worker_yolo.py}
    analyzeScriptPath: ${PRESENCE_ANALYZE_SCRIPT:scripts/video_analyze_yolo.py}
    captureScriptPath: ${PRESENCE_CAPTURE_SCRIPT:scripts/capture_best_snapshots.py}
    storageRoot: ${PRESENCE_STORAGE_ROOT:./data}
    snapshotWindowSec: ${PRESENCE_SNAPSHOT_WINDOW_SEC:5}
    embedScriptPath: ${PRESENCE_EMBED_SCRIPT:scripts/embed_features.py}
    faceEmbedModel: ${PRESENCE_FACE_EMBED_MODEL:buffalo_l}
    bodyEmbedModel: ${PRESENCE_BODY_EMBED_MODEL:osnet_x0_25}
    faceMinDetScore: ${PRESENCE_FACE_MIN_DET_SCORE:0.45}
    # detect=检脸+对齐再提向量（证件照与监控一致）；crop=整图拉伸（跨域弱）
    faceEmbedMode: ${PRESENCE_FACE_EMBED_MODE:detect}
    replayProfileRoot: ${PRESENCE_REPLAY_PROFILE_ROOT:./data/uploadPath}
    replayIngestBaseUrl: ${PRESENCE_REPLAY_INGEST_BASE_URL:http://localhost:8080}
    replayLineY: ${PRESENCE_REPLAY_LINE_Y:520}
    replayRoi: ${PRESENCE_REPLAY_ROI:620,170,1290,760}
    faceMatchThreshold: ${PRESENCE_FACE_MATCH_THRESHOLD:0.35}
    bodyMatchThreshold: ${PRESENCE_BODY_MATCH_THRESHOLD:0.50}
    liveScriptPath: ${PRESENCE_LIVE_SCRIPT:scripts/live_stream_worker_yolo.py}
    clip:
      enabled: ${PRESENCE_CLIP_ENABLED:true}
      preRollSec: ${PRESENCE_CLIP_PRE_ROLL_SEC:5}
      postRollSec: ${PRESENCE_CLIP_POST_ROLL_SEC:3}
      trackLostSec: ${PRESENCE_CLIP_TRACK_LOST_SEC:2}
      sceneMergeGapSec: ${PRESENCE_CLIP_SCENE_MERGE_GAP_SEC:5}
      # true=ffmpeg -c copy 分段环形缓冲后切片（源码流原画质）；false=仅记时间窗
      localRecordingEnabled: ${PRESENCE_CLIP_LOCAL_RECORDING_ENABLED:false}
      ffmpegPath: ${PRESENCE_CLIP_FFMPEG_PATH:ffmpeg}
      ringSegmentSec: ${PRESENCE_CLIP_RING_SEGMENT_SEC:2}
      maxDurationSec: ${PRESENCE_CLIP_MAX_DURATION_SEC:300}
      autoAnalyzeYolo: ${PRESENCE_CLIP_AUTO_ANALYZE_YOLO:true}
      autoImportBehaviorLogs: ${PRESENCE_CLIP_AUTO_IMPORT_BEHAVIOR_LOGS:true}
      # 离线分析与直播隔离：单线程队列，超时强杀 Python，队列满则拒绝并打日志
      analyzePoolSize: ${PRESENCE_CLIP_ANALYZE_POOL_SIZE:1}
      analyzeQueueCapacity: ${PRESENCE_CLIP_ANALYZE_QUEUE_CAPACITY:20}
      analyzeTimeoutSec: ${PRESENCE_CLIP_ANALYZE_TIMEOUT_SEC:1800}
      ezvizRecordingFormat: ${PRESENCE_CLIP_EZVIZ_RECORDING_FORMAT:MP4}
      ezvizAddressExpireSeconds: ${PRESENCE_CLIP_EZVIZ_ADDRESS_EXPIRE_SECONDS:1800}
      ezvizTranscodeBusType: ${PRESENCE_CLIP_EZVIZ_TRANSCODE_BUS_TYPE:7}
      ezvizTranscodePollIntervalMs: ${PRESENCE_CLIP_EZVIZ_TRANSCODE_POLL_INTERVAL_MS:3000}
      ezvizTranscodePollMaxAttempts: ${PRESENCE_CLIP_EZVIZ_TRANSCODE_POLL_MAX_ATTEMPTS:20}
      ezvizSpaceId: ${PRESENCE_CLIP_EZVIZ_SPACE_ID:}
      ezvizResultSpaceId: ${PRESENCE_CLIP_EZVIZ_RESULT_SPACE_ID:}
    analysis:
      enabled: ${PRESENCE_AI_ANALYSIS_ENABLED:false}
      autoRun: ${PRESENCE_AI_ANALYSIS_AUTO_RUN:false}
      timeoutSec: ${PRESENCE_AI_ANALYSIS_TIMEOUT_SEC:180}
      prompt: ${PRESENCE_AI_ANALYSIS_PROMPT:当前监控视角在实验室内部、朝门外拍摄。人物向外走（离开实验室）=出门，向里走（进入实验室）=进门。请分析这段监控视频，只返回JSON对象，字段：summary（用一两句话概括画面中有谁、是进门还是出门、在做什么）、personCount（画面中人数，整数）。不要返回其他字段。}
      videoFps: ${PRESENCE_AI_VIDEO_FPS:2.0}
      frameExtractFps: ${PRESENCE_AI_FRAME_EXTRACT_FPS:1.0}
      maxFrameCount: ${PRESENCE_AI_MAX_FRAME_COUNT:10}
      middleWindowRatio: ${PRESENCE_AI_MIDDLE_WINDOW_RATIO:0.6}
      eventPaddingSec: ${PRESENCE_AI_EVENT_PADDING_SEC:1.5}
      frameWidth: ${PRESENCE_AI_FRAME_WIDTH:960}
      maxBase64Bytes: ${PRESENCE_AI_MAX_BASE64_BYTES:524288}
      oss:
        enabled: ${PRESENCE_AI_OSS_ENABLED:false}
        endpoint: ${PRESENCE_AI_OSS_ENDPOINT:}
        bucket: ${PRESENCE_AI_OSS_BUCKET:}
        accessKeyId: ${PRESENCE_AI_OSS_ACCESS_KEY_ID:}
        accessKeySecret: ${PRESENCE_AI_OSS_ACCESS_KEY_SECRET:}
        publicBaseUrl: ${PRESENCE_AI_OSS_PUBLIC_BASE_URL:}
        objectPrefix: ${PRESENCE_AI_OSS_OBJECT_PREFIX:safetyguard/clips}
      # 具体模型在 application-local.yml 配置；示例见 application-local.example.yml
      models: []
    live:
      targetDetectFps: ${PRESENCE_LIVE_TARGET_FPS:10}
      yoloImgsz: ${PRESENCE_LIVE_YOLO_IMGSZ:960}
      yoloConf: ${PRESENCE_LIVE_YOLO_CONF:0.20}
      enterFaceHuntMaxSec: ${PRESENCE_ENTER_FACE_HUNT_MAX_SEC:10}
      enterFaceGraceSec: ${PRESENCE_ENTER_FACE_GRACE_SEC:4}
      eventIngestEnabled: ${PRESENCE_LIVE_EVENT_INGEST_ENABLED:false}
      lanRtspUsername: ${PRESENCE_LIVE_LAN_RTSP_USERNAME:admin}
      lanRtspPort: ${PRESENCE_LIVE_LAN_RTSP_PORT:554}
      lanRtspStreamPath: ${PRESENCE_LIVE_LAN_RTSP_STREAM_PATH:/h264/ch1/main/av_stream}
      go2rtcBaseUrl: ${GO2RTC_BASE_URL:http://127.0.0.1:1984}
      go2rtcPublicBaseUrl: ${GO2RTC_PUBLIC_BASE_URL:http://127.0.0.1:1984}
      go2rtcRtspBaseUrl: ${GO2RTC_RTSP_BASE_URL:rtsp://127.0.0.1:8554}
      # 保活：worker 异常退出自动重启；断流由 Python 侧重连；Java 重启后续跑
      autoRestartEnabled: ${PRESENCE_LIVE_AUTO_RESTART:true}
      restartBackoffSec: ${PRESENCE_LIVE_RESTART_BACKOFF_SEC:3}
      restartBackoffMaxSec: ${PRESENCE_LIVE_RESTART_BACKOFF_MAX_SEC:60}
      resumeOnBoot: ${PRESENCE_LIVE_RESUME_ON_BOOT:true}
      frameReconnectIdleSec: ${PRESENCE_LIVE_FRAME_RECONNECT_IDLE_SEC:15}
      heartbeatTimeoutSec: ${PRESENCE_LIVE_HEARTBEAT_TIMEOUT_SEC:180}
