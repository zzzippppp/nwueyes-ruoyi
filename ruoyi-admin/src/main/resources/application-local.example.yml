# 本地/服务器私密配置模板
# 用法: 复制为 application-local.yml 后填写真实值（该文件已被 gitignore，不会提交）
#
#   cp application-local.example.yml application-local.yml   # Linux/macOS
#   copy application-local.example.yml application-local.yml # Windows

ruoyi:
  profile: ${NWUEYES_UPLOAD_PATH:./data/uploadPath}

ezviz:
  appKey: ${EZVIZ_APP_KEY:your-ezviz-app-key}
  appSecret: ${EZVIZ_APP_SECRET:your-ezviz-app-secret}

presence:
  ingest:
    enabled: true
    apiKey: ${PRESENCE_INGEST_API_KEY:change-me-ingest-key}
    defaultCameraId: 1
    workspaceRoot: ${PRESENCE_WORKSPACE_ROOT:./ruoyi}
    replayProfileRoot: ${NWUEYES_UPLOAD_PATH:./data/uploadPath}
    replayIngestBaseUrl: ${PRESENCE_INGEST_BASE_URL:http://localhost:8080}
    storageRoot: ${PRESENCE_STORAGE_ROOT:./data}
    replayPythonCommand: ${PRESENCE_PYTHON:python}
    # 门区标定（1920x1080 参考分辨率，其他分辨率会自动缩放）
    replayLineY: 658
    replayRoi: 640,35,1250,680
    snapshotWindowSec: 2.5
    faceMatchThreshold: 0.35
    bodyMatchThreshold: 0.50
    liveScriptPath: scripts/live_stream_worker_yolo.py
    clip:
      # YOLO 人体触发本地录像：ffmpeg -c copy 从 go2rtc RTSP 直拷（勿再用 OpenCV 全帧缓存）
      enabled: true
      localRecordingEnabled: true
      preRollSec: 0
      postRollSec: 3
      trackLostSec: 2
      sceneMergeGapSec: 5
      ffmpegPath: ffmpeg
      maxDurationSec: 300
      autoAnalyzeYolo: true
      autoImportBehaviorLogs: true
    analysis:
      # 通义千问视觉理解（百炼 OpenAI 兼容）：需设置环境变量 DASHSCOPE_API_KEY
      enabled: true
      autoRun: true
      timeoutSec: 180
      prompt: 当前监控视角在实验室内部、朝门外拍摄。人物向外走（离开实验室）=出门，向里走（进入实验室）=进门。请分析这段监控视频，只返回JSON对象，字段：summary（用一两句话概括画面中有谁、是进门还是出门、在做什么）、personCount（画面中人数，整数）。不要返回其他字段。
      videoFps: 2.0
      frameExtractFps: 1.0
      maxFrameCount: 12
      models:
        - enabled: true
          modelKey: qwen3.7-plus
          modelName: qwen3.7-plus
          baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
          apiKey: ${DASHSCOPE_API_KEY:}
      # 可选：启用 OSS 后本地片段会上传公网 URL 再给模型（大文件更稳）
      # oss:
      #   enabled: true
      #   endpoint: oss-cn-hangzhou.aliyuncs.com
      #   bucket: your-bucket
      #   accessKeyId: ${ALIYUN_OSS_AK:}
      #   accessKeySecret: ${ALIYUN_OSS_SK:}
      #   publicBaseUrl: https://your-bucket.oss-cn-hangzhou.aliyuncs.com
    live:
      targetDetectFps: 15
      yoloImgsz: 1280
      yoloConf: 0.20
      enterInferMargin: 80
      exitInferMargin: 80
      eventCooldownSec: 2
      enterFaceHuntMaxSec: 10
      enterFaceGraceSec: 1.5
      eventIngestEnabled: false
      ezvizCloudProtocol: 4
      ezvizCloudQuality: 1
      # 局域网 RTSP（识别/预览唯一拉流方式；ip/验证码从 camera 表读取）
      lanRtspUsername: admin
      lanRtspPort: 554
      lanRtspStreamPath: /h264/ch1/main/av_stream
      # go2rtc：统一拉摄像头 RTSP，再分发给浏览器与 Python。启动见 tools/go2rtc/start-go2rtc.ps1
      go2rtcBaseUrl: ${GO2RTC_BASE_URL:http://127.0.0.1:1984}
      go2rtcPublicBaseUrl: ${GO2RTC_PUBLIC_BASE_URL:http://127.0.0.1:1984}
      go2rtcRtspBaseUrl: ${GO2RTC_RTSP_BASE_URL:rtsp://127.0.0.1:8554}
      autoRestartEnabled: true
      restartBackoffSec: 3
      restartBackoffMaxSec: 60
      resumeOnBoot: true
      frameReconnectIdleSec: 15
      heartbeatTimeoutSec: 180
